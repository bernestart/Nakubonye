<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Nakubonye — I have seen you</title>
    <style>
      html, body { margin: 0; background: #0B0B14; }
      #nk-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 40% at 50% 30%, rgba(168,85,247,0.35) 0%, transparent 70%),
          radial-gradient(50% 30% at 50% 90%, rgba(236,72,153,0.28) 0%, transparent 70%),
          #0B0B14;
        transition: opacity 320ms ease-out;
      }
      #nk-splash.nk-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #nk-splash-logo {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        font-weight: 900;
        font-size: 52px;
        line-height: 1;
        color: #fff;
        background: linear-gradient(135deg, #C084FC 0%, #A855F7 50%, #EC4899 100%);
        box-shadow: 0 20px 60px rgba(168,85,247,0.6), 0 0 80px rgba(236,72,153,0.4);
        animation: nk-splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes nk-splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        #nk-splash-logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="nk-splash">
      <div id="nk-splash-logo">N</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
