name = "nakubonye"
main = "backend/_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoomSQLite"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "ChatRoom", to = "ChatRoomSQLite" }]

[vars]
AUTH_ENFORCE = "1"
MEMBER_ENFORCE = "1"
MESSAGES_ENFORCE = "1"
